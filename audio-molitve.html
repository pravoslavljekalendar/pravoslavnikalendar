<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аудио молитве</title>
  <style>
    body {
      margin: 0;
      background-image: url("papir.png");
      background-size: cover;
      background-attachment: fixed;
      font-family: "Times New Roman", serif;
      color: #4A3728;
      text-align: center;
    }
    .container {
      padding-top: 20px;
      width: 90%;
      max-width: 500px;
      margin: auto;
      padding-bottom: 25px;
    }
    .molitvenik-dugme {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(242, 230, 201, 0.9);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #2E1B08;
      text-decoration: none;
      font-size: 20px;
      z-index: 1000;
      color: #2E1B08;
    }
    /* GORNJA TRAKA ZA IZBOR JEZIKA */
    .pismo-prekidac {
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: bold;
    }
    .pismo-prekidac span {
      cursor: pointer;
      padding: 5px 10px;
    }
    /* TVOJ POPRAVLJENI BRAON STIL ZA SVAKU PESMU */
    .pesma-okvir {
      text-align: center;
      margin: 20px auto;
      width: 95%;
      background: rgba(242, 230, 201, 0.6); /* Bež pozadina */
      border: 1px solid #8b6f47; /* Braon ivica */
      border-radius: 15px; /* Zaobljene ivice */
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .pesma-naslov-tekst {
      color: #5f0606; /* Crveni naslov pesme */
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
    }
    iframe {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Dugme za povratak kući -->
  <a href="molitvenik.html" class="molitvenik-dugme">🏠</a>

  <div class="container">
    
    <!-- Popravljena traka sa jezicima -->
    <div class="pismo-prekidac"> 
      <span onclick="preslovi('cir')">Ћир</span> | 
      <span onclick="preslovi('lat')">Lat</span> | 
      <span onclick="prevediNaEngleski()">Eng</span> 
    </div>

    <h1 style="text-shadow: 1px 1px 2px white; margin-bottom: 25px;">Аудио молитве и песме</h1>

    <!-- Прва песма -->
    <div class="pesma-okvir">
      <p class="pesma-naslov-tekst">Оче наш на арамејском језику</p>
      <iframe src="https://google.com" allow="autoplay"></iframe>
    </div>

    <!-- Друга песма -->
    <div class="pesma-okvir">
      <p class="pesma-naslov-tekst">Устани, Боже, устани</p>
      <iframe src="https://google.com" allow="autoplay"></iframe>
    </div>

    <!-- Трећа песма -->
    <div class="pesma-okvir">
      <p class="pesma-naslov-tekst">Пресвета Богородице Спаси Нас</p>
      <iframe src="https://google.com" allow="autoplay"></iframe>
    </div>

    <!-- Четврта песма -->
    <div class="pesma-okvir">
      <p class="pesma-naslov-tekst">Душо моја свет се нагло мења</p>
      <iframe src="https://google.com" allow="autoplay"></iframe>
    </div>

    <br><br>
    <a href="#" style="text-decoration:none; font-size: 26px; padding: 15px 30px; color:#8b6f47; font-weight: bold;">⬆ Врх странице</a>
    <br><br>
  </div>

  <!-- Skripte za oflajn jezike ostaju na dnu stranice -->
  <script>
    // Tvoj kod za ćirilicu/latinicu i oflajn engleski rečnik...
  </script>

</body>
</html>
