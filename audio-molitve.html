      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;

    }

</head>

// Funkcija koja pravi listu dugmića na ekranu
function napraviListuPesama() {
  pesme.forEach((pesma, index) => {
    const red = document.createElement("div");
    red.className = "pesma-red";
    red.onclick = () => pustiPesmu(index, pesma.naslov, pesma.id);
    
    red.innerHTML = `
      <span class="pesma-naslov">🎵 ${pesma.naslov}</span>
      <span class="dugme-pusti">▶</span>
    `;
    listaKontejner.appendChild(red);
  });
}

// Funkcija koja puni gornji okvir tvojim sigurnim Google Drive linkom
function pustiPesmu(index, naziv, driveId) {
  naslov.innerText = "Сада изабрано: " + naziv;
  
  // Vraćamo tvoj stari /preview link koji Google Drive 100% dozvoljava i nikada ne koči!
  prozor.src = "https://google.com" + driveId + "/preview";
}

// Učitaj prvu pesmu kao početnu
if(pesme.length > 0) {
  pustiPesmu(0, pesme[0].naslov, pesme[0].id);
}

// Pokretanje pravljenja liste pri učitavanju
