    .dugme-pusti {

    }
    /* MESTO GDE SE POJAVLJUJE JEDAN JEDINI AKUTELNI PLEJER */
    .plejer-kontejner {
      margin-top: 12px;
      display: none; /* Sakriven dok se ne klikne na tu pesmu */
    }
    iframe {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 10px;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Dugme za povratak kući -->

// Funkcija koja gradi listu na ekranu
function napraviListu() {
  pesme.forEach((pesma, index) => {
    const blok = document.createElement("div");
    blok.className = "pesma-blok";
    blok.id = "blok-" + index;
    
    blok.innerHTML = `
      <div class="pesma-vrh" onclick="pustiPesmuDirektno(${index}, '${pesma.id}')">
        <span class="pesma-naslov">☦️ ${pesma.naslov}</span>
        <span class="dugme-pusti" id="strelica-${index}">▶</span>
      </div>
      <div class="plejer-kontejner" id="plejer-${index}"></div>
    `;
    
    listaKontejner.appendChild(blok);
  });
}

// Pametna funkcija: Otvara originalni prozorčić BAŠ TDE gde je kliknuto!
function pustiPesmuDirektno(index, driveId) {
  // Prvo zatvori sve druge pleere koji su možda otvoreni na ekranu
  const sviPlejevi = document.querySelectorAll('.plejer-kontejner');
  sviPlejevi.forEach(p => { p.innerHTML = ''; p.style.display = 'none'; });
  
  const sveStrelice = document.querySelectorAll('.dugme-pusti');
  sveStrelice.forEach(s => s.innerText = '▶');

  // Otvori plejer tačno ispod kliknute pesme
  const trenutniPlejer = document.getElementById("plejer-" + index);
  const trenutnaStrelica = document.getElementById("strelica-" + index);
  
  trenutniPlejer.style.display = "block";
  trenutnaStrelica.innerText = "▼"; // Menja se strelica na dole da označi da je otvoreno
  
  // Ubacujemo tvoj originalni /preview link koji Google 100% prihvata jer se stvara ispočetka!
  trenutniPlejer.innerHTML = `
    <iframe src="https://google.com{driveId}/preview" allow="autoplay"></iframe>
  `;
}

// Pokreni pravljenje liste čim se stranica učita
napraviListu();
</script>
