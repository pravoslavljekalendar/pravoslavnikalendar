<p>&nbsp;</p>
<font size="3" face="Arial">

<p><a name="1"></a>1. Хвалите Господа сви народи, славите га сва племена;</p>

<p><a name="2"></a>2. Јер је велика милост његова к нама, и истина Господња траје довијека. Алилуја!</p>
